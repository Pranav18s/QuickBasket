apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quickbasket-ingress
  namespace: quickbasket
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: quickbasket-api
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quickbasket-web
                port:
                  number: 3000
