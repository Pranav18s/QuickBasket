apiVersion: v1
kind: ConfigMap
metadata:
  name: quickbasket-config
  namespace: quickbasket
data:
  NODE_ENV: "production"
  API_PORT: "5000"
  MONGODB_URI: "mongodb://mongo:27017/quickbasket"
  CORS_ORIGIN: "http://localhost:3000,http://localhost:3001,http://localhost:8080"
  COOKIE_SECURE: "false"
  JWT_EXPIRES_IN: "7d"
  AI_MODEL: "gpt-4o-mini"
