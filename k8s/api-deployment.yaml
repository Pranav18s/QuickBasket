apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickbasket-api
  namespace: quickbasket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quickbasket-api
  template:
    metadata:
      labels:
        app: quickbasket-api
    spec:
      containers:
        - name: api
          image: quickbasket-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: quickbasket-config
            - secretRef:
                name: quickbasket-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: quickbasket-api
  namespace: quickbasket
spec:
  selector:
    app: quickbasket-api
  ports:
    - name: http
      port: 5000
      targetPort: http
  type: ClusterIP
