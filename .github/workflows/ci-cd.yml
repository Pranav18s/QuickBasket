# QuickBasket CI/CD
#
# CI is executable: lint, tests, Next.js build, Docker image builds,
# Docker Compose configuration validation, and Kubernetes manifest validation.
#
# CD examples below are intentionally commented out. They will NOT deploy.
#
# IMPORTANT:
# - k8s/ currently contains Minikube/demo manifests, not production EKS manifests.
# - docker-compose.yml is local development configuration, not a production EC2 stack.
# - Configure secrets and production-specific manifests before enabling any CD section.

name: QuickBasket CI/CD

on:
  push:
    branches: [main, development, "feature/**"]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickbasket-ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint API
        run: npm run lint --workspace=apps/api
      - name: Lint frontend
        run: npm run lint --workspace=apps/web

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: API tests
        run: npm run test --workspace=apps/api --if-present
      - name: Shared package tests
        run: npm run test --workspace=packages/shared --if-present

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
        run: npm run build --workspace=apps/web

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: quickbasket-api:ci-${{ github.sha }}
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://quickbasket-api:5000
          tags: quickbasket-web:ci-${{ github.sha }}

  playwright:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
        working-directory: apps/web
      - name: Run Playwright tests
        run: npx playwright test --reporter=html
        working-directory: apps/web
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore

  docker-compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate local Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

  kubernetes-validation:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Schema validation only; this does not start Minikube or a cluster.
      - name: Validate k8s manifests with Kubeconform
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary /work/k8s

